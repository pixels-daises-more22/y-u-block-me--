<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Y U Block Me</title>

<style>
body {
    margin: 0;
    background: white;
    overflow: hidden;
}

.box {
    width: 80px;
    height: 80px;
    background: #6c63ff;
    position: absolute;
    top: 100px;
    left: 50px;
    animation: move 3s infinite alternate ease-in-out;
}

.words {
    position: absolute;
    top: 115px;
    left: 600px;
    font-family: Arial, sans-serif;
    font-size: 40px;
    font-weight: bold;
    opacity: 0;
    animation: appear 3s infinite alternate ease-in-out;
}

@keyframes move {
    0% {
        left: 50px;
        transform: rotate(0deg);
    }

    100% {
        left: 500px;
        transform: rotate(360deg);
    }
}

@keyframes appear {
    0% {
        opacity: 0;
    }

    70% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }
}
</style>

</head>

<body>

<div class="box"></div>

<div class="words">
    Y U Block me on snap? >:(
</div>

</body>
</html>
